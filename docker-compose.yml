services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit_data:/app/data
    networks:
      - agent_gateway
      - executor_internal
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 64
    networks:
      - agent_gateway
    restart: "no"

  executor:
    build:
      context: .
      dockerfile: docker/executor.Dockerfile

    # Enable explicitly while the service entry point is being integrated.
    profiles:
      - executor

    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 64

    # Only the executor receives this workspace.
    volumes:
      - executor_workspace:/workspace

    # Provide temporary space for Python and test execution.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

    networks:
      - executor_internal

    restart: "no"

networks:
  agent_gateway:
    driver: bridge

  executor_internal:
    driver: bridge
    internal: true

volumes:
  audit_data:
  executor_workspace: