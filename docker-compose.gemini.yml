# Optional real Supervisor. Only Gateway receives the local credential file.
services:
  gateway:
    environment:
      SUPERVISOR_PROVIDER: gemini
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_ENV_FILE: /run/secrets/gemini.env
    secrets:
      - source: gemini_configuration
        target: gemini.env
  agent:
    command: ["python", "-m", "agent.agent_loop", "--llm-mode", "mock", "--gateway-url", "http://gateway:8000", "--gateway-timeout", "45", "--acknowledge-exposure"]
secrets:
  gemini_configuration:
    file: ${GEMINI_ENV_FILE:-.env}
