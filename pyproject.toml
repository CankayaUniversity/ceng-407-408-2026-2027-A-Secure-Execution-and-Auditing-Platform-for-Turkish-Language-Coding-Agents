
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-coding-agent"
version = "0.1.0"
description = "Secure execution and auditing platform for coding agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
