# Task-scoped ABAC model for the secure tool gateway.
# Call enforce(scope, tool, resource) with a validated TaskScope loaded by
# TaskRegistry.get_scope(call.task_id), never a scope supplied by the agent.
# resource is arguments.path for file tools or arguments.profile_id for tests.
# Policies enable/disable tools globally; task grants stay in TaskScope.
# Exact grants only: directory listing is not recursive and grants no file access.
# .env, .env.* and .git path components are protected for all file tools.
# The executor must still enforce containment, symlink safety and list filtering.
# Model errors must stop execution; they must never be converted to ALLOW.

[request_definition]
r = scope, tool, resource

[policy_definition]
p = tool, eft

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = r.tool == p.tool \
    && r.tool in r.scope.allowed_tools \
    && (r.tool == "secure_run_tests" || !regexMatch(r.resource, "(^|.*/)([.]env([.][^/]*)?|[.]git)(/|$)")) \
    && ((r.tool == "secure_read_file" && r.resource in r.scope.readable_files) \
    || (r.tool == "secure_edit_file" && r.resource in r.scope.writable_files) \
    || (r.tool == "secure_list_files" && r.resource in r.scope.listable_directories) \
    || (r.tool == "secure_run_tests" && r.resource in r.scope.allowed_test_profiles))
