name: CI

on:
  push:
    branches: [main, prototype_v1]
  pull_request:
    branches: [main, prototype_v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q
